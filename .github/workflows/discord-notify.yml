name: Discord Activity Notifications
on:
  push:
    # Dependabot pushes cannot read Actions secrets; PR and CI events report these updates.
    branches-ignore: ['dependabot/**']
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed, review_requested]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Package, Release, Publish Update Feed]
    types: [in_progress, completed]
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    # Fork review events have no repository secrets; lifecycle and conversation comments still notify.
    if: >-
      !startsWith(github.event_name, 'pull_request_review') ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted default-branch notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Privileged events must never execute pull request code or artifacts.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Send notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/discord-notify.mjs
