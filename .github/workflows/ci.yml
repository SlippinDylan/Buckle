name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_app: ${{ steps.app.outputs.present }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Report actual stage start
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/discord-notify.mjs --ci-start
      - id: changes
        name: Classify changes
        run: python3 Scripts/ci-changes.py
      - name: Check engineering baseline
        if: steps.changes.outputs.baseline == 'true'
        run: python3 -B Scripts/check.py
      - id: app
        run: |
          if test -f 'Buckle.xcodeproj/project.pbxproj'; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'PENDING: Xcode app is not integrated. No app was compiled.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test '${{ steps.changes.outputs.build }}' = false; then
            echo 'No app build inputs changed. App compilation skipped; automatic release is skipped too.' >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    name: Build Debug app
    needs: baseline
    if: needs.baseline.outputs.has_app == 'true' && needs.baseline.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and check source
        run: bash Scripts/check.sh
      - name: Test native SwiftPM resource layout
        run: swift test --build-system native --filter PermissionGuidance
      - name: Build Universal 2 Debug app
        run: |
          xcodebuild build -project Buckle.xcodeproj -scheme Buckle \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-CI -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= APP_UPDATER_ENABLED=NO
          bash Scripts/verify-bundle.sh --distribution build/DerivedData-CI/Build/Products/Debug/Buckle.app
  check:
    name: check
    needs: [baseline, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the required branch-protection check
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          BUILD_REQUIRED: ${{ needs.baseline.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$BASELINE_RESULT" = success
          if test "$BUILD_REQUIRED" = true; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$BUILD_RESULT" = skipped
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - name: Report checks passed before downstream packaging
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/discord-notify.mjs --stage-result CI success
