name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and check source
        run: bash Scripts/check.sh
      - name: Build Universal 2 app
        run: |
          xcodebuild build -project Buckle.xcodeproj -scheme Buckle \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            BUCKLE_UPDATER_ENABLED=NO
          binary=build/DerivedData/Build/Products/Release/Buckle.app/Contents/MacOS/Buckle
          lipo "$binary" -verify_arch arm64 x86_64
          bash Scripts/verify-bundle.sh build/DerivedData/Build/Products/Release/Buckle.app
